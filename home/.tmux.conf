# ---- Algemeen ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1           # windows starten bij 1 (niet 0)
setw -g pane-base-index 1     # panes ook bij 1
set -g renumber-windows on    # hernummer windows als je er een sluit
set -g history-limit 10000
set -sg escape-time 10        # snellere escape in neovim

# ---- Prefix: Ctrl+Space ----
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---- Vi-mode ----
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Splits: intuïtief met | en - ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Pane navigatie met vim-toetsen ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Pane resize ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Window navigatie ----
bind -r [ previous-window
bind -r ] next-window

# ---- Nieuw window in huidige pad ----
bind c new-window -c "#{pane_current_path}"

# ---- Config herladen ----
bind r source-file ~/.tmux.conf \; display "Config herladen!"

# ---- Statusbalk ----
set -g status-position bottom
set -g status-style "bg=#011423,fg=#CBE0F0"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#44FFB1,bold] #S #[fg=#CBE0F0]| "
set -g status-right "#[fg=#CBE0F0]%d %b  #[fg=#44FFB1,bold]%H:%M "

# Actief window
setw -g window-status-current-style "fg=#011423,bg=#0FC5ED,bold"
setw -g window-status-current-format " #I #W "

# Inactief window
setw -g window-status-style "fg=#CBE0F0,bg=#011423"
setw -g window-status-format " #I #W "

# Actieve pane border
set -g pane-active-border-style "fg=#0FC5ED"
set -g pane-border-style "fg=#214969"

# ---- TPM (Tmux Plugin Manager) ----
# Installeer met: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # sessies bewaren na reboot
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save sessies

set -g @continuum-restore 'on'

# Run TPM (moet onderaan staan)
run '~/.tmux/plugins/tpm/tpm'
