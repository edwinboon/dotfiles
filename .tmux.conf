# Enable mouse support
set -g mouse on

# Split panes using | and -
bind | split-window -h
bind - split-window -v

# Switch panes easily
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf

# Status bar style
set -g status-bg colour235
set -g status-fg white
